name: CI/CD TsuyaApp

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1 : vérification TypeScript (toutes les branches) ───────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

  # ─── Job 2 : build EAS + soumission TestFlight (main uniquement) ─────────
  build-and-submit:
    name: EAS Build + TestFlight
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (iOS production)
        run: eas build --platform ios --profile production --non-interactive

      # ⏳ Activé une fois le compte Apple Developer validé
      # - name: EAS Submit vers TestFlight
      #   run: eas submit --platform ios --profile production --non-interactive
      #   env:
      #     EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
      #     EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
